# Render Blueprint — one-click deploy of the whole stack.
# In the Render dashboard: New + > Blueprint > connect this repo. Render reads this file and
# provisions a managed Postgres plus one web service.
#
# One service, not two: the root Dockerfile builds the React bundle into the Spring Boot jar,
# so the dashboard and the API share an origin. Nothing here depends on a hostname Render
# assigns, which is what broke the previous two-service version — the names it hard-coded had
# been taken by an unrelated account, so the frontend pointed at a stranger's site.

databases:
  - name: tradejournal-db
    databaseName: tradejournal
    user: tradejournal
    plan: free

services:
  - type: web
    name: tradejournal-amerritt
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: demo          # loads db/seed so the demo login has trades to show
      - key: DB_HOST
        fromDatabase: { name: tradejournal-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: tradejournal-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: tradejournal-db, property: database }
      - key: DB_USER
        fromDatabase: { name: tradejournal-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: tradejournal-db, property: password }
      - key: TRADEJOURNAL_JWT_SECRET
        generateValue: true   # Render generates a strong 256-bit secret
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=75
