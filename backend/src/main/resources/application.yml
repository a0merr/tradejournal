spring:
  application:
    name: tradejournal
  datasource:
    # Either set SPRING_DATASOURCE_URL directly (docker-compose), or supply the
    # discrete DB_* parts (Render wires these from the managed database).
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tradejournal}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:tradejournal}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:tradejournal}}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

tradejournal:
  jwt:
    secret: ${TRADEJOURNAL_JWT_SECRET:dev-only-secret-please-override-with-a-256-bit-value-in-prod}
    # Access tokens are stateless and therefore not revocable, so the window in which a stolen
    # one is useful is kept short. Continuity comes from the rotating refresh token below.
    expiration-minutes: ${TRADEJOURNAL_JWT_EXPIRATION_MINUTES:15}
    refresh-expiration-days: ${TRADEJOURNAL_REFRESH_EXPIRATION_DAYS:30}
  cors:
    # Comma-separated list of origins allowed to call the API (the deployed frontend).
    allowed-origins: ${TRADEJOURNAL_CORS_ORIGINS:http://localhost:5173}
  rate-limit:
    # Token bucket per client IP on the unauthenticated auth endpoints. Generous enough that a
    # person never meets it; tight enough that credential stuffing does.
    auth-attempts: ${TRADEJOURNAL_RATE_LIMIT_ATTEMPTS:20}
    auth-window-minutes: ${TRADEJOURNAL_RATE_LIMIT_WINDOW_MINUTES:5}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui

server:
  port: 8080

---
spring:
  config:
    activate:
      on-profile: dev
  flyway:
    locations: classpath:db/migration,classpath:db/seed

---
# The hosted demo. Same seed as dev, but a distinct profile so "what is running in production"
# never reads as "somebody left the dev profile on".
spring:
  config:
    activate:
      on-profile: demo
  flyway:
    locations: classpath:db/migration,classpath:db/seed
